# center-geo configuration (optional).
#
# If this file is present, `center-geo scan --config .center-geo.yml`
# will use it. Otherwise the default config is used (see
# docs/01 §FR5 for the default knobs).

include:
  globs: ["**/*.ts", "**/*.tsx"]
exclude:
  globs: ["**/*.test.ts", "**/node_modules/**", "**/dist/**"]

boundaries:
  tags:
    ui: { globs: ["src/ui/**", "src/components/**"] }
    persistence: { globs: ["src/db/**", "src/repositories/**"] }
  forbidden_crossings: []

engines:
  radial: { enabled: true, max_depth: 4, max_nodes: 500 }
  cycle: { enabled: true, max_cycle_size: 50 }
  boundary: { enabled: true }
  anomaly: { enabled: true, percentile_threshold: 0.95 }
  convergent: { enabled: true, convergent_min_branches: 3 }

scoring:
  geometry_bonus_per_extra_geometry: 0.5
  independence_bonus_per_extra_independent_method: 0.2
  boundary_bonus: 0.3
  state_bonus: 0.2
  cycle_bonus: 0.4
  test_gap_bonus: 0.1
  contradiction_penalty: 0.5
  capability_gap_penalty: 0.3

report:
  top_n_hypotheses: 20
  redact: true
